<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="description" content="词间：王陆语料库背词、听写、错词复习与原录音精听工作台。">
<title>词间 · 王陆听力工作台</title>
<style>:root {
  color-scheme: light;
  --bg: #eaf2ef; --surface: #f8fcfa; --surface-2: #edf4f1;
  --ink: #203f3a; --muted: #536f66; --line: #39796224;
  --green: #227c64; --green-hover: #17634f; --green-soft: #65b99b18;
  --hero: #e1f1e9; --gold: #987839; --red: #af4f46; --red-soft: #fcefeb;
  --on-accent: #fff; --glass: #ffffff80; --glass-strong: #ffffffb8;
  --edge: #ffffffd9; --glass-highlight: #ffffffb3;
  --shadow: 0 12px 32px -14px #285d4926, 0 2px 5px #285d4905, inset 0 1px 0 var(--glass-highlight);
  --orb: radial-gradient(ellipse at 30% 19%, #ffffffec 0%, #f3fff7b8 25%, #b9e4d780 57%, #74b7a266 80%, #b6e4d2a6 100%);
  --serif: Georgia, 'Noto Serif SC', 'Songti SC', 'SimSun', serif;
  --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif;
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #101f27; --surface: #1a3039; --surface-2: #203a42;
  --ink: #e1f2ed; --muted: #9ab8b1; --line: #b0ebd91f;
  --green: #a1e3cb; --green-hover: #bcefdc; --green-soft: #8cd8bd15;
  --hero: #203f43; --gold: #dfc58b; --red: #f1a89a; --red-soft: #482f30;
  --on-accent: #123e31; --glass: #1c35419c; --glass-strong: #223e49d1;
  --edge: #d0ffed29; --glass-highlight: #d0ffed1f;
  --shadow: 0 14px 36px -14px #00000059, 0 2px 6px #0000000d, inset 0 1px 0 var(--glass-highlight);
  --orb: radial-gradient(ellipse at 30% 19%, #bbfff489 0%, #77d7c440 23%, #3f82782b 50%, #123c445e 77%, #5dbaa87a 100%);
}
* { box-sizing: border-box; }
body {
  margin: 0; isolation: isolate; background: var(--bg);
  color: var(--ink); font: 14px/1.65 var(--sans); -webkit-font-smoothing: antialiased;
}
body::before {
  content: ''; position: fixed; inset: 0; z-index: -2; pointer-events: none;
  background: radial-gradient(ellipse at 3% 2%, #b2dccc99, transparent 43%),
    radial-gradient(ellipse at 96% 14%, #c3dcf080, transparent 43%),
    radial-gradient(ellipse at 64% 88%, #eee8cf80, transparent 48%);
}
body::after {
  content: ''; position: fixed; inset: 0; z-index: -1; pointer-events: none; opacity: .25;
  background-image: radial-gradient(#598e792b .65px, transparent .65px); background-size: 6px 6px;
}
:root[data-theme="dark"] body::before {
  background: radial-gradient(ellipse at 2% 5%, #28584870, transparent 43%),
    radial-gradient(ellipse at 93% 15%, #284b7266, transparent 44%),
    radial-gradient(ellipse at 66% 95%, #25544840, transparent 48%);
}
button, input, select, textarea { font: inherit; }
button, a, input, select, textarea { -webkit-tap-highlight-color: transparent; }
button { cursor: pointer; transition: background .2s, border-color .2s, box-shadow .2s, transform .2s; }
button:disabled { cursor: default; opacity: .45; }
a { color: inherit; text-decoration: none; }
button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible {
  outline: 3px solid var(--green); outline-offset: 4px;
}
input, textarea, select { color: var(--ink); }
h1, h2, h3, p { margin: 0; }
h1, h2, h3 { font-weight: 650; line-height: 1.4; }
p { color: var(--muted); }
small { font-size: 12px; }
hr { border: 0; border-top: 1px solid var(--line); margin: 26px 0; }
.icon { width: 20px; height: 20px; flex-shrink: 0; vertical-align: middle; }
.boot { padding: 10vh; text-align: center; }

/* The frame floats over a shared, softly lit background. */
.workspace { display: grid; grid-template-columns: 228px minmax(0, 1fr); min-height: 100vh; gap: 12px; padding: 16px; }
.sidebar {
  position: sticky; top: 16px; height: calc(100dvh - 32px); min-height: 600px;
  display: flex; flex-direction: column; padding: 28px 16px 20px;
  border: 1px solid var(--edge); border-radius: 26px;
  background: linear-gradient(145deg, var(--glass-strong), var(--glass));
  backdrop-filter: blur(24px) saturate(150%); -webkit-backdrop-filter: blur(24px) saturate(150%);
  box-shadow: var(--shadow), inset -1px 0 0 var(--glass-highlight);
}
.brand { display: flex; gap: 12px; align-items: center; padding: 0 12px; font-size: 26px; letter-spacing: 2px; font-weight: 650; }
.brand-mark {
  display: grid; place-items: center; position: relative; overflow: hidden;
  width: 44px; height: 48px; border: 1px solid #ffffff8c; border-radius: 15px;
  background: linear-gradient(145deg, #6abc9d, #23745e 65%, #1c614e);
  color: #fff; font: 26px var(--serif); text-shadow: 0 1px 3px #174f4a66;
  box-shadow: inset 0 2px 3px #ffffff70, inset 0 -3px 5px #17463845, 0 6px 12px #2a70562b;
}
.brand-mark::before { content: ''; position: absolute; width: 55px; height: 26px; background: #ffffff26; top: -5px; left: -10px; border-radius: 50%; transform: rotate(-24deg); }
.brand small { display: block; font: 8px var(--sans); letter-spacing: 1.7px; color: var(--muted); margin-top: 4px; }
.nav-label { font-size: 10px; letter-spacing: 1.5px; color: var(--muted); margin: 43px 16px 15px; }
.sidebar nav { display: grid; gap: 8px; }
.nav-item {
  position: relative; display: flex; align-items: center; gap: 13px; border: 1px solid transparent;
  background: transparent; color: var(--muted); padding: 13px 15px; border-radius: 14px; text-align: left; font-size: 13px;
}
.nav-item:hover { background: var(--glass); color: var(--ink); }
.nav-item.active {
  background: linear-gradient(120deg, var(--glass-strong), var(--green-soft));
  border-color: var(--edge); color: var(--green); font-weight: 650;
  box-shadow: 0 5px 13px #20553e09, inset 0 1px 1px var(--glass-highlight);
}
.nav-item.active::after { content: ''; width: 5px; height: 5px; border-radius: 50%; background: var(--green); position: absolute; right: 12px; box-shadow: 0 0 8px #55bb9866; }
.nav-count { margin-left: auto; font-size: 10px; background: var(--surface); border-radius: 6px; padding: 0 5px; margin-right: 9px; }
.sidebar-foot { margin-top: auto; padding: 32px 12px 0; font-size: 10px; color: var(--muted); }
.sidebar-note { border-top: 1px solid var(--line); padding-top: 24px; margin-bottom: 26px; }
.sidebar-note p { font-size: 14px; line-height: 1.85; color: var(--ink); margin: 12px 0 8px; }
.sidebar-note small { display: block; font-size: 8px; letter-spacing: 1.3px; }
.sidebar-sound { display: flex; align-items: center; gap: 4px; height: 24px; color: var(--green); }
.sidebar-sound i { width: 4px; height: 11px; border-radius: 6px; background: currentColor; opacity: .55; box-shadow: inset 0 1px 0 #ffffff80; }
.sidebar-sound i:nth-child(2), .sidebar-sound i:nth-child(4) { height: 19px; opacity: .8; }
.sidebar-sound i:nth-child(3) { height: 27px; }
.local-dot { display: inline-block; width: 5px; height: 5px; border-radius: 50%; background: var(--green); margin-right: 5px; box-shadow: 0 0 0 3px var(--green-soft); }
.main-shell { min-width: 0; }
.topbar {
  height: 62px; border: 1px solid var(--edge); padding: 0 26px; display: flex;
  align-items: center; justify-content: space-between; gap: 16px; border-radius: 21px;
  background: var(--glass); box-shadow: inset 0 1px 0 var(--glass-highlight);
  backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
}
.breadcrumb { font-size: 11px; color: var(--muted); }
.breadcrumb span { padding: 0 12px; opacity: .4; }
.top-actions { display: flex; align-items: center; gap: 22px; }
.today-date { font-size: 11px; color: var(--muted); }
.top-actions .button { border: 1px solid var(--edge); border-radius: 10px; background: var(--glass); box-shadow: inset 0 1px 0 var(--glass-highlight); }
main { max-width: 1240px; margin: auto; padding: 32px 26px 24px; outline: none; }
.page-foot { max-width: 1240px; margin: auto; padding: 12px 26px 20px; display: flex; justify-content: space-between; gap: 12px; color: var(--muted); font-size: 10px; letter-spacing: .4px; }
.page-heading { display: flex; justify-content: space-between; align-items: end; gap: 20px; margin-bottom: 25px; }
.eyebrow { font-size: 9px; letter-spacing: 2px; font-weight: 600; color: var(--muted); display: block; margin-bottom: 9px; }
h1 { font-size: 31px; letter-spacing: -.7px; margin-bottom: 8px; }
.page-heading p, .practice-heading p { font-size: 12px; }
.edition { font-size: 10px; color: var(--muted); white-space: nowrap; margin-bottom: 6px; padding: 6px 11px; border: 1px solid var(--edge); border-radius: 20px; background: var(--glass); }

/* Specular edges and inset shade give controls a small glass bevel. */
.button {
  display: inline-flex; align-items: center; justify-content: center; gap: 9px;
  min-height: 43px; padding: 10px 20px; border-radius: 12px; border: 1px solid transparent;
  font-size: 12px; font-weight: 550; white-space: nowrap;
}
.button .icon { width: 16px; height: 16px; }
.primary {
  background: linear-gradient(155deg, #348d72, #216b56 70%); color: var(--on-accent);
  border-color: #ffffff38; box-shadow: 0 5px 12px #1b6a4930, inset 0 1px 1px #ffffff59, inset 0 -2px 3px #164d4733;
}
.primary:hover { background: linear-gradient(155deg, #3a9579, #1c614d); box-shadow: 0 8px 18px #1b6a4938, inset 0 1px 1px #ffffff66; }
:root[data-theme="dark"] .primary { background: linear-gradient(150deg, #c0f3db, #8dd6ba); box-shadow: 0 5px 16px #00000026, inset 0 1px 1px #ffffff99; border-color: #d9ffed80; }
:root[data-theme="dark"] .primary:hover { background: #b6efcf; }
.secondary { background: var(--glass-strong); border-color: var(--edge); color: var(--green); box-shadow: var(--shadow); }
.secondary:hover { border-color: var(--green); background: var(--surface); }
.quiet { background: transparent; color: var(--muted); }
.quiet:hover { background: var(--surface-2); color: var(--ink); }
.small { min-height: 34px; padding: 6px 11px; font-size: 11px; border-radius: 9px; }
.wide { width: 100%; }
.text-button { padding: 4px 0; background: transparent; border: 0; color: var(--green); font-size: 12px; }
.text-button:hover { text-decoration: underline; text-underline-offset: 4px; }
.actions { display: flex; align-items: center; gap: 12px; margin-top: 24px; }
.actions.compact { margin: 0; gap: 8px; }
.actions.wrap { flex-wrap: wrap; }
.icon-button { display: inline-flex; align-items: center; justify-content: center; width: 30px; height: 30px; border: 0; border-radius: 8px; background: transparent; color: var(--muted); }
.icon-button:hover { background: var(--green-soft); color: var(--green); }
.icon-button .icon { width: 15px; height: 15px; }

/* The daily goal is a CSS glass sphere: no canvas, remote assets or runtime. */
.dashboard-hero {
  position: relative; isolation: isolate; overflow: hidden; display: grid; grid-template-columns: minmax(0, 1fr) 310px;
  gap: 16px; align-items: center; padding: 32px 34px; border: 1px solid var(--edge); border-radius: 27px;
  background: radial-gradient(ellipse at 83% 55%, #9edbc147, transparent 54%),
    linear-gradient(115deg, var(--glass-strong), var(--glass));
  box-shadow: var(--shadow), inset 0 -1px 1px var(--glass-highlight);
}
.dashboard-hero::before {
  content: ''; position: absolute; width: 390px; height: 390px; border: 1px solid var(--glass-highlight);
  border-radius: 50%; right: -120px; top: -250px; z-index: -1;
  box-shadow: 0 0 0 34px #ffffff08, 0 0 0 35px var(--glass-highlight), 0 0 0 78px #ffffff05, 0 0 0 79px #ffffff33;
}
:root[data-theme="dark"] .dashboard-hero { background: radial-gradient(ellipse at 83% 55%, #3b9a7f24, transparent 58%), linear-gradient(115deg, var(--glass-strong), var(--glass)); }
:root[data-theme="dark"] .dashboard-hero::before { opacity: .35; }
.hero-copy { position: relative; z-index: 2; }
.pill { display: inline-flex; align-items: center; gap: 7px; font-size: 9px; letter-spacing: .5px; border: 1px solid var(--edge); padding: 6px 11px; border-radius: 20px; color: var(--green); background: var(--glass); box-shadow: inset 0 1px 0 var(--glass-highlight); }
.pill .icon { width: 12px; height: 12px; }
.hero-copy h2 { font-size: clamp(28px, 2.6vw, 39px); font-weight: 650; line-height: 1.6; letter-spacing: -1px; margin: 17px 0 10px; }
.hero-accent { color: var(--green); }
.hero-copy p { font-size: 12px; max-width: 400px; line-height: 1.9; }
.hero-note { display: block; color: var(--muted); font-size: 10px; margin-top: 14px; }
.hero-progress { position: relative; display: grid; justify-items: center; align-content: center; gap: 28px; padding: 20px 0 8px; min-height: 268px; font-size: 10px; color: var(--muted); }
.glass-orbit { position: absolute; width: 300px; height: 250px; top: 1px; left: 50%; margin-left: -150px; pointer-events: none; }
.orbit-line { position: absolute; width: 295px; height: 112px; left: 3px; top: 61px; border: 1px solid var(--glass-highlight); border-radius: 50%; transform: rotate(-30deg); box-shadow: 0 1px 0 #5c9c7826; }
.orbit-back { transform: rotate(38deg); opacity: .6; }
.orbit-front { z-index: 3; border-top-color: transparent; border-right-color: transparent; top: 79px; }
.floating-glyph {
  display: grid; place-items: center; position: absolute; z-index: 4; width: 49px; height: 49px; border: 1px solid var(--edge); border-radius: 16px;
  background: linear-gradient(145deg, var(--glass-strong), var(--green-soft));
  color: var(--green); box-shadow: 0 9px 17px -5px #316c4f38, inset 0 2px 2px var(--glass-highlight), inset 0 -2px 4px #3c8a6526;
  backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
}
.glyph-word { font: italic 23px var(--serif); top: 23px; left: 12px; transform: rotate(-14deg); animation: glass-float 8s ease-in-out infinite; }
.glyph-audio { right: 0; bottom: 42px; width: 43px; height: 43px; border-radius: 14px; transform: rotate(13deg); animation: glass-float 8s ease-in-out -4s infinite; }
.glyph-audio .icon { width: 21px; height: 21px; }
.orbit-spark { position: absolute; bottom: 28px; left: 46px; width: 12px; height: 12px; border-radius: 50%; background: radial-gradient(circle at 30% 25%, #fff, #8fcbac 65%, #6ca68f); box-shadow: 0 3px 5px #3d806638; }
.progress-ring {
  position: relative; z-index: 2; padding: 8px; width: 204px; height: 204px; border-radius: 50%;
  background: var(--glass);
  border: 1px solid var(--edge); transform: rotate(-7deg);
  box-shadow: 0 24px 26px -15px #276a4f3d, 0 4px 10px #285c4b12, inset 0 2px 4px #ffffff80, inset 0 -2px 5px #48775d26;
}
.progress-ring::before { content: ''; position: absolute; inset: -9px; border: 1px solid var(--glass-highlight); border-radius: 50%; pointer-events: none; }
.progress-ring::after {
  content: ''; position: absolute; inset: 0; padding: 7px; border-radius: 50%; pointer-events: none;
  background: conic-gradient(from -35deg, var(--green) var(--progress), var(--glass-highlight) 0);
  -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
  -webkit-mask-composite: xor; mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0); mask-composite: exclude;
}
.progress-ring > div {
  position: relative; height: 100%; overflow: hidden; display: flex; align-items: center; justify-content: center; flex-direction: column;
  border: 1px solid var(--edge); border-radius: 50%; background: var(--orb); transform: rotate(7deg);
  box-shadow: inset 0 5px 12px #ffffff66, inset 0 -10px 22px #4f93752b;
}
.progress-ring > div::before { content: ''; position: absolute; top: 6%; left: 15%; width: 61%; height: 30%; border-radius: 50%; background: linear-gradient(#ffffff70, #ffffff00); transform: rotate(-24deg); pointer-events: none; }
.progress-ring strong { position: relative; font-size: 59px; font-weight: 500; letter-spacing: -3px; color: var(--ink); line-height: 1.25; font-variant-numeric: tabular-nums; text-shadow: 0 2px 1px var(--glass-highlight); }
.progress-ring .ring-eyebrow { font-size: 8px; letter-spacing: 1.5px; margin-bottom: 5px; color: var(--muted); }
.progress-ring .ring-target { font-size: 11px; margin-top: 2px; color: var(--muted); }
.progress-caption { position: relative; z-index: 2; font-size: 9px; letter-spacing: .2px; }
@keyframes glass-float { 50% { translate: 0 -7px; } }

.metric-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 13px; margin-top: 16px; }
.metric { display: flex; gap: 14px; align-items: center; background: var(--glass); border: 1px solid var(--edge); border-radius: 18px; padding: 18px; box-shadow: var(--shadow); }
.metric > .icon { color: var(--green); width: 41px; height: 43px; padding: 11px; border: 1px solid var(--edge); border-radius: 13px; background: linear-gradient(150deg, var(--glass-strong), var(--green-soft)); box-shadow: inset 0 2px 2px var(--glass-highlight), 0 3px 6px #27684f0d; }
.metric:nth-child(2) > .icon { color: #7186ba; background-color: #8797d01a; }
.metric:nth-child(3) > .icon { color: var(--gold); background-color: #d9b55e1a; }
.metric:nth-child(4) > .icon { color: #bb7f70; background-color: #ce947f1a; }
:root[data-theme="dark"] .metric:nth-child(2) > .icon { color: #afc5fb; }
:root[data-theme="dark"] .metric:nth-child(4) > .icon { color: #efb5a6; }
.metric span { display: block; color: var(--muted); font-size: 10px; }
.metric strong { display: block; font-size: 25px; font-weight: 550; line-height: 1.35; margin-top: 4px; letter-spacing: -.7px; font-variant-numeric: tabular-nums; }
.metric small { font: 10px var(--sans); color: var(--muted); margin-left: 7px; letter-spacing: 0; }
.section-heading { display: flex; align-items: center; justify-content: space-between; gap: 15px; margin: 30px 0 15px; }
.section-heading h2 { font-size: 14px; letter-spacing: .2px; }
.section-heading > span { font-size: 10px; color: var(--muted); }
.panel > .section-heading:first-child { margin-top: 0; }
.mode-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; perspective: 1000px; }
.mode-card {
  --mode-tone: var(--green); --mode-wash: #74cba01c;
  position: relative; isolation: isolate; overflow: hidden; border: 1px solid var(--edge); border-radius: 22px;
  background: radial-gradient(ellipse at 100% 0, var(--mode-wash), transparent 75%), var(--glass);
  box-shadow: var(--shadow); padding: 24px; text-align: left; color: var(--ink);
  transition: transform .3s, box-shadow .3s, border-color .3s;
}
.mode-card[data-lane="audio"] { --mode-tone: #596b9b; --mode-wash: #9daee226; }
.mode-card[data-lane="dictation"] { --mode-tone: #896629; --mode-wash: #dfbf8524; }
:root[data-theme="dark"] .mode-card[data-lane="audio"] { --mode-tone: #bacaf2; }
:root[data-theme="dark"] .mode-card[data-lane="dictation"] { --mode-tone: #e4c793; }
.mode-card::after { content: ''; position: absolute; z-index: -1; width: 140%; height: 120%; left: -160%; top: -40%; background: linear-gradient(110deg, transparent 30%, var(--glass-highlight) 50%, transparent 70%); transform: rotate(-15deg); transition: left .65s; pointer-events: none; }
.mode-card-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
.mode-icon {
  display: grid; place-items: center; width: 48px; height: 50px; color: var(--mode-tone);
  border: 1px solid var(--edge); border-radius: 16px; transform: rotate(-6deg);
  background: linear-gradient(145deg, var(--glass-strong), var(--mode-wash));
  box-shadow: inset 0 2px 3px var(--glass-highlight), inset 0 -2px 4px var(--mode-wash), 3px 6px 10px #285e4c12;
}
.mode-icon .icon { width: 24px; height: 24px; }
.mode-number { font-size: 11px; letter-spacing: 1px; color: var(--muted); opacity: .65; }
.mode-caption { display: block; font-size: 8px; letter-spacing: 1.4px; color: var(--mode-tone); margin-bottom: 5px; }
.mode-card h3 { font-size: 17px; margin-bottom: 7px; }
.mode-card p { font-size: 11px; }
.mode-link { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 22px; font-size: 11px; color: var(--mode-tone); }
.mode-link .icon { width: 27px; height: 27px; padding: 6px; border: 1px solid var(--edge); border-radius: 50%; background: var(--glass); box-shadow: inset 0 1px 0 var(--glass-highlight); }

.panel { background: var(--glass); border: 1px solid var(--edge); border-radius: 21px; padding: 25px; box-shadow: var(--shadow); }
.panel p { font-size: 12px; line-height: 1.9; }
.panel h3 { font-size: 14px; }
.inset { margin-top: 25px; }
.subtle { background: var(--green-soft); box-shadow: inset 0 1px 0 var(--glass-highlight); }
.empty-state { text-align: center; padding: 30px 20px; }
.empty-state > .icon { width: 43px; height: 43px; padding: 11px; color: var(--green); margin-bottom: 14px; border: 1px solid var(--edge); border-radius: 14px; background: var(--glass-strong); box-shadow: var(--shadow); }
.empty-state h3 { font-size: 16px; margin-bottom: 8px; font-weight: 550; }
.empty-state p { font-size: 11px; }
.muted { color: var(--muted); }
.success { color: var(--green); }
.danger { color: var(--red); }

/* Carry the same glass material into practice, forms and dialogs. */
input, select, textarea { border-radius: 10px; background: var(--glass); border-color: var(--line); box-shadow: inset 0 1px 2px #294f3c06; }
input:focus, select:focus, textarea:focus { border-color: var(--green); }
input[type="checkbox"] { box-shadow: none; }
.chapter-card, .special-card { border-radius: 13px; background: var(--glass); border-color: var(--edge); box-shadow: inset 0 1px 0 var(--glass-highlight); }
.chapter-card.selected { box-shadow: inset 0 1px 0 var(--glass-highlight), 0 0 0 1px var(--green); }
.session-preview { background: linear-gradient(150deg, var(--glass-strong), var(--green-soft)); border-color: var(--edge); }
.playback-bar, .practice-footer { background: var(--glass-strong); border-color: var(--edge); border-radius: 15px; backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px); box-shadow: var(--shadow); }
.playback-bar { top: 12px; z-index: 4; }
.practice-footer { padding: 14px 18px; bottom: 12px; }
.recall-card { position: relative; background: radial-gradient(ellipse at 50% 0, var(--green-soft), transparent 70%), var(--glass); border-color: var(--edge); border-radius: 28px; box-shadow: var(--shadow), inset 0 -1px 0 var(--glass-highlight); }
.recall-progress { height: 5px; background: var(--line); }
.recall-progress > div { box-shadow: 0 1px 6px var(--green-soft); }
.audio-orb { background: var(--orb); border-color: var(--edge); box-shadow: inset 0 3px 4px var(--glass-highlight), inset 0 -4px 8px #3c826326, 0 10px 18px #2468461a; }
.modal { border-radius: 24px; background: var(--glass-strong); border-color: var(--edge); backdrop-filter: blur(32px) saturate(130%); -webkit-backdrop-filter: blur(32px) saturate(130%); box-shadow: 0 30px 100px #061f2840, inset 0 1px 0 var(--glass-highlight); }
.modal::backdrop { background: #122b324d; backdrop-filter: blur(7px); }
.modal-content > h2 { font-family: var(--sans); font-size: 24px; }
.toast { border: 1px solid var(--edge); border-radius: 14px; background: var(--ink); color: var(--surface); box-shadow: 0 8px 30px #0002; }
.recording-drop { border-radius: 16px; background: var(--green-soft); }
.resume-banner { background: var(--glass-strong); border: 1px solid var(--edge); border-radius: 14px; box-shadow: var(--shadow); }
.dictation-input:focus { background: var(--glass); }
.spelling-chain { border-radius: 10px; }
@media (hover: hover) and (pointer: fine) {
  .primary:hover { transform: translateY(-2px); }
  .mode-card:hover { transform: translateY(-5px) rotateX(2deg); border-color: var(--mode-tone); box-shadow: 0 18px 30px -14px #285d493d, inset 0 1px 0 var(--glass-highlight); }
  .mode-card:hover::after { left: 120%; }
  .chapter-card:hover, .special-card:hover { transform: translateY(-2px); }
}
